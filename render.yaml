# Blueprint Render : crée l'API et le site en une fois.
# Render → New → Blueprint → choisir ce dépôt. La base de données est sur Neon (DATABASE_URL).
services:
  # API Node.js (Docker)
  - type: web
    name: wetrack-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: ohio # même région que la base Neon (us-east-2)
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # chaîne de connexion Neon (directe, sans « -pooler »)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Adresse publique du site (fromService « host » donne un nom interne inutilisable par le navigateur).
      - key: CORS_ORIGIN
        value: https://wetrack-web.onrender.com
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrateur

  # Frontend React (site statique)
  - type: web
    name: wetrack-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Adresse publique de l'API, intégrée au build du site.
      - key: VITE_API_URL
        value: https://wetrack-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
